# 全局训练通用配置
max_seq_len: 50
batch_size: 64
lr: 0.00001
epochs: 50
weight_decay: 1e-5
grad_clip_norm: 1.0
patience: 10
device: "cpu"

# 模型超参
gnn_hidden: 256
embed_dim: 128
fusion_dim: 256
fourier_order: 5

# 6个数据集配置
datasets:
  tox21:
    dataset_path: "/home/student/xjy/ke4y/data/tox21.csv"
    smiles_column_index: 13
    fingerprint_column_index: 14  # -1=自动计算指纹；>=0=读取csv指纹列
    descriptor_start_index: 15
    descriptor_end_index: 23      # start==end 自动计算描述符；差值8读取csv描述符
    multi_label_start: 0   # 第一个标签列索引
    multi_label_end: 12    # 最后一个标签列后一位，读取[0,12)共12列标签
    task_num: 12
    fp_dim: 256
    desc_dim: 8
  bbbp:
    dataset_path: "/home/student/xjy/ke4y/data//bbbp.csv"
    smiles_column_index: 0
    fingerprint_column_index: -1
    descriptor_start_index: 0
    descriptor_end_index: 0
    label_col_idx: 1
    fp_dim: 256
    desc_dim: 8
  bace:
    dataset_path: "/home/student/xjy/ke4y/data/bace.csv"
    smiles_column_index: 0
    fingerprint_column_index: -1
    descriptor_start_index: 0
    descriptor_end_index: 0
    label_col_idx: 1
    fp_dim: 256
    desc_dim: 8
  clintox:
    dataset_path: "/home/student/xjy/ke4y/data/clintox.csv"
    smiles_column_index: 0
    fingerprint_column_index: -1
    descriptor_start_index: 0
    descriptor_end_index: 0
    multi_label_start: 1   # 两个标签从第1列开始
    multi_label_end: 3     # [1,3) 取第1、2两列，共2个任务
    task_num: 2
    fp_dim: 256
    desc_dim: 8
  hiv:
    dataset_path: "/home/student/xjy/ke4y/data/hiv.csv"
    smiles_column_index: 0
    fingerprint_column_index: -1
    descriptor_start_index: 0
    descriptor_end_index: 0
    label_col_idx: 2
    fp_dim: 256
    desc_dim: 8
  muv:
    dataset_path: "/home/student/xjy/ke4y/data/muv.csv"
    smiles_column_index: 18
    fingerprint_column_index: -1
    descriptor_start_index: 0
    descriptor_end_index: 0
    multi_label_start: 0
    multi_label_end: 17   # [1,18) 一共17列标签
    task_num: 17
    fp_dim: 256
    desc_dim: 8
  sider:
    dataset_path: "/home/student/xjy/ke4y/data/sider.csv"   
    smiles_column_index: 0
    fingerprint_column_index: -1  
    label_col_idx: -1           
    descriptor_start_index: -1    
    descriptor_end_index: -1
    multi_label_start: 1          # 标签起始列
    multi_label_end: 28           # 标签结束列（左闭右开，共27列）
    task_num: 27